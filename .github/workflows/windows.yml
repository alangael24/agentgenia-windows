name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt

      - name: Test backend and Pi harness
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test and build NSIS installer
        run: pnpm dist:win

      - name: Smoke test packaged backend and Pi runtime
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "release/win-unpacked/AgentGenia.exe" -ArgumentList "--runtime-smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged runtime smoke test failed with exit code $($process.ExitCode)." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AgentGenia-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
